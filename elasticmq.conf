include classpath("application.conf")

node-address {
    protocol = http
    host = sqs
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = Strict
}

rest-stats {
    enabled = true
    bind-port = 9325
    bind-hostname = "0.0.0.0"
}

queues {
    apart-notification-dlq {
        defaultVisibilityTimeout = 60s
        delay = 0s
        receiveMessageWait = 0s
    }
    apart-notification-queue {
        defaultVisibilityTimeout = 60s
        delay = 0s
        receiveMessageWait = 0s
        deadLettersQueue {
            name = "apart-notification-dlq"
            maxReceiveCount = 3
        }
    }
}
