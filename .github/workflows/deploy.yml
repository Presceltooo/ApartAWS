name: CI/CD → ECR & EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Khi chạy thủ công → build & deploy toàn bộ

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Phát hiện service nào có thay đổi code
  # ─────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api-gateway:        ${{ steps.filter.outputs.api-gateway }}
      auth-service:       ${{ steps.filter.outputs.auth-service }}
      apartment-service:  ${{ steps.filter.outputs.apartment-service }}
      booking-service:    ${{ steps.filter.outputs.booking-service }}
      web-portal:         ${{ steps.filter.outputs.web-portal }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      # Flag đặc biệt: khi thay đổi infra → build lại tất cả
      infra:              ${{ steps.filter.outputs.infra }}
      # Khi chạy thủ công (workflow_dispatch) → luôn build tất cả
      is-manual:          ${{ steps.manual.outputs.is-manual }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if manual trigger
        id: manual
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is-manual=true" >> $GITHUB_OUTPUT
          else
            echo "is-manual=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - 'apps/api-gateway/**'
            auth-service:
              - 'apps/auth-service/**'
            apartment-service:
              - 'apps/apartment-service/**'
            booking-service:
              - 'apps/booking-service/**'
            web-portal:
              - 'apps/web-portal/**'
            notification-service:
              - 'apps/notification-service/**'
            infra:
              - 'docker-compose.prod.yml'
              - 'docker-compose.yml'
              - 'nginx.conf'
              - '.github/workflows/**'
              - 'init-schemas.sql'

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Push — Mỗi service là 1 job độc lập có điều kiện riêng
  # ─────────────────────────────────────────────────────────────────────────

  build-api-gateway:
    name: Build → api-gateway
    runs-on: ubuntu-latest
    needs: detect-changes
    # Chạy nếu: thay đổi infra, thay đổi code service, hoặc chạy thủ công
    if: |
      needs.detect-changes.outputs.api-gateway == 'true' ||
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.is-manual == 'true'
    outputs:
      built: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & Push
        run: |
          docker build \
            -f ./apps/api-gateway/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/api-gateway:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/api-gateway:latest \
            ./apps/api-gateway
          docker push ${{ env.ECR_REGISTRY }}/api-gateway:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/api-gateway:latest

  build-auth-service:
    name: Build → auth-service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.auth-service == 'true' ||
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.is-manual == 'true'
    outputs:
      built: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & Push
        run: |
          docker build \
            -f ./apps/auth-service/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/auth-service:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/auth-service:latest \
            ./apps/auth-service
          docker push ${{ env.ECR_REGISTRY }}/auth-service:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/auth-service:latest

  build-apartment-service:
    name: Build → apartment-service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.apartment-service == 'true' ||
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.is-manual == 'true'
    outputs:
      built: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & Push
        run: |
          docker build \
            -f ./apps/apartment-service/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/apartment-service:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/apartment-service:latest \
            ./apps/apartment-service
          docker push ${{ env.ECR_REGISTRY }}/apartment-service:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/apartment-service:latest

  build-booking-service:
    name: Build → booking-service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.booking-service == 'true' ||
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.is-manual == 'true'
    outputs:
      built: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & Push
        run: |
          docker build \
            -f ./apps/booking-service/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/booking-service:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/booking-service:latest \
            ./apps/booking-service
          docker push ${{ env.ECR_REGISTRY }}/booking-service:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/booking-service:latest

  build-web-portal:
    name: Build → web-portal
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.web-portal == 'true' ||
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.is-manual == 'true'
    outputs:
      built: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & Push
        run: |
          docker build \
            -f ./apps/web-portal/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/web-portal:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/web-portal:latest \
            ./apps/web-portal
          docker push ${{ env.ECR_REGISTRY }}/web-portal:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/web-portal:latest

  build-notification-service:
    name: Build → notification-service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.notification-service == 'true' ||
      needs.detect-changes.outputs.infra == 'true' ||
      needs.detect-changes.outputs.is-manual == 'true'
    outputs:
      built: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & Push
        run: |
          docker build \
            -f ./apps/notification-service/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/notification-service:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/notification-service:latest \
            ./apps/notification-service
          docker push ${{ env.ECR_REGISTRY }}/notification-service:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/notification-service:latest

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy lên EC2 — Chỉ restart service đã thay đổi
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Đợi tất cả build jobs hoàn thành (kể cả job bị skip)
    needs:
      - detect-changes
      - build-api-gateway
      - build-auth-service
      - build-apartment-service
      - build-booking-service
      - build-web-portal
      - build-notification-service
    # Chỉ chạy nếu ít nhất 1 trong 6 build jobs không bị skip và thành công
    if: |
      always() && (
        needs.build-api-gateway.result == 'success' ||
        needs.build-auth-service.result == 'success' ||
        needs.build-apartment-service.result == 'success' ||
        needs.build-booking-service.result == 'success' ||
        needs.build-web-portal.result == 'success' ||
        needs.build-notification-service.result == 'success'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            echo "=== [Chuẩn bị] Kiểm tra Docker daemon ==="
            if ! timeout 10s docker info >/dev/null 2>&1; then
              echo "⚠️ Docker daemon bị treo! Đang tự động khởi động lại..."
              sudo systemctl restart docker || sudo service docker restart || true
              sleep 5
            fi

            echo "=== [Chuẩn bị] Kiểm tra dung lượng ổ đĩa ==="
            df -h
            docker system df || true

            echo "=== [Chuẩn bị] Dọn dẹp tài nguyên trước khi pull ==="
            docker system prune -f || true

            echo "=== [1/4] Đăng nhập vào ECR ==="
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            echo "=== [2/4] Vào thư mục project ==="
            cd ${{ secrets.EC2_APP_DIR }}

            echo "=== [3/4] Pull code mới nhất ==="
            git pull origin main

            echo "=== [4/4] Cập nhật IMAGE_TAG và restart các service thay đổi ==="
            IMAGE_TAG="${{ github.sha }}"
            IMAGE_TAG="${IMAGE_TAG:0:8}"
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env || echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            export ECR_REGISTRY="${{ secrets.ECR_REGISTRY }}"
            export IMAGE_TAG="${IMAGE_TAG}"

            # ── Xác định service nào cần restart ──────────────────────────
            NEED_API_GW="${{ needs.build-api-gateway.result }}"
            NEED_AUTH="${{ needs.build-auth-service.result }}"
            NEED_APARTMENT="${{ needs.build-apartment-service.result }}"
            NEED_BOOKING="${{ needs.build-booking-service.result }}"
            NEED_WEB="${{ needs.build-web-portal.result }}"
            NEED_NOTIF="${{ needs.build-notification-service.result }}"

            deploy_service() {
              local SERVICE_NAME=$1
              echo "  → Pulling & restarting: $SERVICE_NAME"
              docker-compose -f docker-compose.prod.yml pull "$SERVICE_NAME"
              docker-compose -f docker-compose.prod.yml up -d --no-deps "$SERVICE_NAME"
            }

            [ "$NEED_API_GW"   = "success" ] && deploy_service "api-gateway"
            [ "$NEED_AUTH"     = "success" ] && deploy_service "auth-service"
            [ "$NEED_APARTMENT"= "success" ] && deploy_service "apartment-service"
            [ "$NEED_BOOKING"  = "success" ] && deploy_service "booking-service"
            [ "$NEED_WEB"      = "success" ] && deploy_service "web-portal"
            [ "$NEED_NOTIF"    = "success" ] && deploy_service "notification-service"

            echo "=== Xóa images cũ để giải phóng dung lượng ==="
            sleep 20
            timeout 90s docker image prune -af || echo "⚠️ Prune timeout, bỏ qua."

            echo "✅ Deploy hoàn tất!"
