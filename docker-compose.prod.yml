# docker-compose.prod.yml
# Dùng cho môi trường PRODUCTION trên EC2
# Images được kéo từ Amazon ECR (build bởi GitHub Actions)

version: "3.8"

services:
  # ── Database ──────────────────────────────────────────
  database:
    image: postgres:15
    container_name: apart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - apart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Auth Service ──────────────────────────────────────
  auth-service:
    image: ${ECR_REGISTRY}/auth-service:${IMAGE_TAG:-latest}
    container_name: apart-auth
    command: sh -c "npx prisma migrate deploy && node dist/main"
    restart: unless-stopped
    stop_grace_period: 2s
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?schema=auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - apart-network
    deploy:
      resources:
        limits:
          memory: 200M

  # ── Apartment Service ─────────────────────────────────
  apartment-service:
    image: ${ECR_REGISTRY}/apartment-service:${IMAGE_TAG:-latest}
    container_name: apart-service
    command: sh -c "npx prisma db push && node dist/main"
    restart: unless-stopped
    stop_grace_period: 2s
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?schema=apartment
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - apart-network
    deploy:
      resources:
        limits:
          memory: 200M

  # ── Booking Service ───────────────────────────────────
  booking-service:
    image: ${ECR_REGISTRY}/booking-service:${IMAGE_TAG:-latest}
    container_name: apart-booking
    command: sh -c "npx prisma migrate deploy && node dist/main"
    restart: unless-stopped
    stop_grace_period: 2s
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?schema=booking
      APARTMENT_SERVICE_URL: http://apartment-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAIL_FROM: ${MAIL_FROM}
      SQS_NOTIFICATION_QUEUE_URL: ${SQS_NOTIFICATION_QUEUE_URL}
    depends_on:
      database:
        condition: service_healthy
      apartment-service:
        condition: service_started
    networks:
      - apart-network
    deploy:
      resources:
        limits:
          memory: 200M

  # ── Payment Service ───────────────────────────────────
  payment-service:
    image: ${ECR_REGISTRY}/payment-service:${IMAGE_TAG:-latest}
    container_name: apart-payment
    command: node dist/main
    restart: unless-stopped
    stop_grace_period: 2s
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?schema=booking
      APARTMENT_SERVICE_URL: http://apartment-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      VNP_TMN_CODE: ${VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET}
      VNP_RETURN_URL: ${VNP_RETURN_URL}
      VNP_URL: ${VNP_URL}
      SQS_NOTIFICATION_QUEUE_URL: ${SQS_NOTIFICATION_QUEUE_URL}
    depends_on:
      database:
        condition: service_healthy
      apartment-service:
        condition: service_started
    networks:
      - apart-network
    deploy:
      resources:
        limits:
          memory: 150M

  # ── Notification Service ──────────────────────────────
  notification-service:
    image: ${ECR_REGISTRY}/notification-service:${IMAGE_TAG:-latest}
    container_name: apart-notification
    command: sh -c "npx prisma migrate deploy && node dist/main"
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?schema=notification
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAIL_FROM: ${MAIL_FROM}
      SQS_NOTIFICATION_QUEUE_URL: ${SQS_NOTIFICATION_QUEUE_URL}
    networks:
      - apart-network
    deploy:
      resources:
        limits:
          memory: 150M

  # ── API Gateway ───────────────────────────────────────
  api-gateway:
    image: ${ECR_REGISTRY}/api-gateway:${IMAGE_TAG:-latest}
    container_name: apart-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      APARTMENT_SERVICE_URL: http://apartment-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
    depends_on:
      - auth-service
      - apartment-service
      - booking-service
      - notification-service
      - payment-service
    networks:
      - apart-network
    deploy:
      resources:
        limits:
          memory: 150M

  # ── Frontend (Web Portal) ─────────────────────────────
  web-portal:
    image: ${ECR_REGISTRY}/web-portal:${IMAGE_TAG:-latest}
    container_name: apart-frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Nginx phục vụ tĩnh, port 80
    depends_on:
      - api-gateway
    networks:
      - apart-network
    deploy:
      resources:
        limits:
          memory: 50M

volumes:
  postgres_data:

networks:
  apart-network:
    driver: bridge
