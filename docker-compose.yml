# ==============================================================================
# LOCAL DEVELOPMENT ONLY
# File cấu hình này chỉ dùng để chạy và phát triển thử nghiệm cục bộ (Local Dev).
# Các thông tin tài khoản, mật khẩu cơ sở dữ liệu, JWT Secret bên dưới đều là
# giá trị mẫu (dummy/mock data), TUYỆT ĐỐI KHÔNG SỬ DỤNG CHO PRODUCTION.
# Khi triển khai Production, vui lòng sử dụng file docker-compose.prod.yml.
# ==============================================================================

version: "3.8"

services:
  # Database PostgreSQL
  database:
    image: postgres:15
    container_name: apart-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apart_booking
    ports:
      - "5432:5432"
    volumes:
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - apart-network

  # API Gateway
  api-gateway:
    image: node:20-alpine
    container_name: apart-gateway
    working_dir: /app
    volumes:
      - ./apps/api-gateway:/app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      APARTMENT_SERVICE_URL: http://apartment-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
    depends_on:
      - auth-service
      - apartment-service
      - booking-service
      - notification-service
      - payment-service
    networks:
      - apart-network

  # Auth Service
  auth-service:
    image: node:20-alpine
    container_name: apart-auth
    working_dir: /app
    volumes:
      - ./apps/auth-service:/app
    command: sh -c "npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://user:password@database:5432/apart_booking?schema=auth
      JWT_SECRET: your-dev-secret-key
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: your-dev-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      - database
    networks:
      - apart-network

  # Apartment Service (Monolith cũ đã tỉa bớt Auth)
  apartment-service:
    image: node:20-alpine
    container_name: apart-service
    working_dir: /app
    volumes:
      - ./apps/apartment-service:/app
    command: sh -c "npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://user:password@database:5432/apart_booking?schema=apartment
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAIL_FROM: ${EMAIL_ADDRESS}
    depends_on:
      - database
    networks:
      - apart-network

  # Booking Service
  booking-service:
    image: node:20-alpine
    container_name: apart-booking
    working_dir: /app
    volumes:
      - ./apps/booking-service:/app
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://user:password@database:5432/apart_booking?schema=booking
      APARTMENT_SERVICE_URL: http://apartment-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAIL_FROM: ${MAIL_FROM}
      SQS_ENDPOINT: ${SQS_ENDPOINT}
      SQS_NOTIFICATION_QUEUE_URL: ${SQS_NOTIFICATION_QUEUE_URL}
    depends_on:
      - database
      - apartment-service
      - sqs
    networks:
      - apart-network

  # Payment Service (VNPay Integration)
  payment-service:
    image: node:20-alpine
    container_name: apart-payment
    working_dir: /app
    volumes:
      - ./apps/payment-service:/app
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npm run start:dev"
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://user:password@database:5432/apart_booking?schema=booking
      APARTMENT_SERVICE_URL: http://apartment-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      VNP_TMN_CODE: ${VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET}
      VNP_RETURN_URL: ${VNP_RETURN_URL}
      VNP_URL: ${VNP_URL}
      SQS_ENDPOINT: ${SQS_ENDPOINT}
      SQS_NOTIFICATION_QUEUE_URL: ${SQS_NOTIFICATION_QUEUE_URL}
    depends_on:
      - database
      - apartment-service
      - sqs
    networks:
      - apart-network

  # Local SQS Emulator (ElasticMQ)
  sqs:
    image: softwaremill/elasticmq-native:1.6.2
    container_name: apart-sqs
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    networks:
      - apart-network

  # Notification Service (SQS Consumer & Email Sender)
  notification-service:
    image: node:20-alpine
    container_name: apart-notification
    working_dir: /app
    volumes:
      - ./apps/notification-service:/app
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://user:password@database:5432/apart_booking?schema=notification
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MAIL_FROM: ${MAIL_FROM}
      SQS_ENDPOINT: ${SQS_ENDPOINT}
      SQS_NOTIFICATION_QUEUE_URL: ${SQS_NOTIFICATION_QUEUE_URL}
    depends_on:
      - database
      - sqs
    networks:
      - apart-network

  # Frontend React Vite
  frontend:
    image: node:20-alpine
    container_name: apart-frontend
    working_dir: /app
    volumes:
      - ./apps/web-portal:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5174:5173"
    depends_on:
      - api-gateway
    networks:
      - apart-network

networks:
  apart-network:
    driver: bridge

# Note: Hai file Dockerfile bạn vừa tạo là dành cho môi trường PRODUCTION (Khi chạy thực tế / deploy server).
# Ở môi trường DEV code hằng ngày, thay vì dùng Dockerfile để build tĩnh, mình dùng cấu hình 'volumes' ở trên
# để copy trực tiếp code từ máy bạn vào Docker container, khi bạn code bằng VSCode, server mới tự load lại (hot-reload).
